events {

}


http {
    # General API IP-level rate limit
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=5r/s;

    # OTP-specific IP-level rate limit
    limit_req_zone $binary_remote_addr zone=otp_ip_limit:10m rate=5r/s;

    server {

        listen 80;

        location = /api/v1/auth/request_otp {

            limit_req zone=otp_ip_limit burst=2 nodelay;

            proxy_pass http://web:8000;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v1/orders/ {
            resolver 127.0.0.11 valid=30s;
            set $upstream_order_service http://order_service:8002;

            rewrite ^/api/v1/orders/(.*)$ /$1 break;

            proxy_pass $upstream_order_service;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v1/admin/orders/ {
            resolver 127.0.0.11 valid=30s;
            set $upstream_order_service http://order_service:8002;

            rewrite ^/api/v1/admin/orders/(.*)$ /admin/$1 break;

            proxy_pass $upstream_order_service;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v1/ai/ {
            resolver 127.0.0.11 valid=30s;
            set $upstream_ai_service http://ai_service:8001;

            rewrite ^/api/v1/ai/(.*)$ /$1 break;

            proxy_pass $upstream_ai_service;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {

            proxy_pass http://web:8000;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

        }

    }

}