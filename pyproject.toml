[project]
name = "fullstack-ai-project"
version = "0.1.0"
description = "This is the Full Stack E-commerce AI platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aio-pika>=10.0.1",
    "aiosqlite>=0.22.1",
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "boto3>=1.43.62",
    "faker>=40.37.0",
    "fastapi[standard]>=0.140.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.13.0",
    "python-dotenv>=1.2.2",
    "redis>=8.0.1",
    "resend>=2.35.0",
    "sqlalchemy>=2.0.51",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
